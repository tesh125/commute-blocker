<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Commute Blocker</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 260px;
      padding: 14px 16px;
      color: #1a1a1a;
    }
    h1 { font-size: 15px; margin: 0 0 10px; }
    button {
      width: 100%;
      padding: 8px 10px;
      font-size: 13px;
      border: none;
      border-radius: 6px;
      margin-top: 8px;
      cursor: pointer;
    }
    #connect { background: #2563eb; color: white; }
    #connect:hover { background: #1d4ed8; }
    #runNow { background: #eee; color: #1a1a1a; }
    #runNow:hover { background: #ddd; }
    #openOptions { background: none; color: #2563eb; text-decoration: underline; }
    #status {
      margin-top: 12px;
      font-size: 12px;
      color: #444;
      white-space: pre-wrap;
    }
    #status.error { color: #dc2626; }
    #connectedAccount {
      margin-top: 10px;
      font-size: 12px;
      color: #16a34a;
      display: none;
    }
  </style>
</head>
<body>
  <h1>Commute Blocker</h1>
  <button id="connect">Connect Google Calendar</button>
  <button id="runNow">Check now</button>
  <button id="openOptions">Settings</button>
  <div id="connectedAccount"></div>
  <div id="status">Loading status…</div>

  <script src="popup.js"></script>
</body>
</html>
